# Mosquitto 2.0 Configuration for Smart Door Lock System
per_listener_settings false

# Standard TCP Listener for Microcontrollers (ESP32) and Go Backend Service
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket Listener for Web / Debugging Clients
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Persistence Configuration
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# Logging Configuration
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
